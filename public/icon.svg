<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#18181b"/>
      <stop offset="100%" stopColor="#09090b"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#34d399"/>
      <stop offset="100%" stopColor="#059669"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8"/>
      <stop offset="100%" stopColor="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Base Background with safe rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#27272a" stroke-width="4"/>

  <!-- Candlestick chart elements -->
  <!-- Candle 1 (Loss/Bearish - subtle zinc/rose) -->
  <line x1="140" y1="180" x2="140" y2="340" stroke="#71717a" stroke-width="6" stroke-linecap="round"/>
  <rect x="120" y="210" width="40" height="90" rx="8" fill="#3f3f46" stroke="#71717a" stroke-width="4"/>

  <!-- Candle 2 (Neutral/Transition) -->
  <line x1="216" y1="150" x2="216" y2="360" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round"/>
  <rect x="196" y="230" width="40" height="70" rx="8" fill="url(#cyanGrad)"/>

  <!-- Candle 3 (Major Bullish / Growth - Emerald) -->
  <g filter="url(#glow)">
    <line x1="292" y1="120" x2="292" y2="380" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
    <rect x="270" y="160" width="44" height="150" rx="8" fill="url(#emeraldGrad)"/>
  </g>

  <!-- Candle 4 (Continuation) -->
  <line x1="368" y1="110" x2="368" y2="310" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
  <rect x="348" y="130" width="40" height="110" rx="8" fill="url(#emeraldGrad)"/>

  <!-- Ascending Trendline -->
  <polyline points="100,350 200,280 292,210 412,130" fill="none" stroke="#6ee7b7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <circle cx="412" cy="130" r="8" fill="#10b981"/>

  <!-- TB Monogram at bottom -->
  <text x="256" y="440" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="38" font-weight="800" fill="#f4f4f5" letter-spacing="4">TRADEBOOK</text>
</svg>
